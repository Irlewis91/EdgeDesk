<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeDesk</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EdgeDesk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D1E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4FB; --sheet:#FFFFFF; --sheet2:#ECEEFA; --ink:#15173B; --ink2:#5A5F8C; --rule:#DCDFF0;
  --mark:#C8F442; --mark-ink:#15173B; --win:#0B8F5F; --loss:#D63A52; --link:#5B3DF5; --chip:#E6E8F7;
  --brand:#5B3DF5; --brand2:#9B5CF6; --on-brand:#FFFFFF; --warn:#B7791F;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --text:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rail:212px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B0D1E; --sheet:#14172E; --sheet2:#1B1F3B; --ink:#ECEEFF; --ink2:#9BA1CC; --rule:#272C50;
  --mark:#C6F432; --mark-ink:#0B0D1E; --win:#3DDC97; --loss:#FF6B81; --link:#A99BFF; --chip:#232848;
  --brand:#8E7BFF; --brand2:#C084FC; --on-brand:#0B0D1E; --warn:#F2C14E;}}
:root[data-theme="dark"]{--paper:#0B0D1E; --sheet:#14172E; --sheet2:#1B1F3B; --ink:#ECEEFF; --ink2:#9BA1CC; --rule:#272C50;
  --mark:#C6F432; --mark-ink:#0B0D1E; --win:#3DDC97; --loss:#FF6B81; --link:#A99BFF; --chip:#232848;
  --brand:#8E7BFF; --brand2:#C084FC; --on-brand:#0B0D1E; --warn:#F2C14E;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--text)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--win)}.bad{color:var(--loss)}.muted{color:var(--ink2)}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.005em;line-height:1.1;margin:0}
h1{font-size:40px}h2{font-size:26px}h3{font-size:19px;font-weight:600}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 9%,var(--paper)),var(--paper) 46%)}
.logo{font:700 26px/1 var(--cond);letter-spacing:.01em;padding:0 8px}
.logo{color:var(--brand)}.logo b{color:var(--mark-ink);background:var(--mark);border-radius:5px;padding:0 5px;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--sheet2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--link)}
.nav button[aria-current="page"]{background:var(--sheet);color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--brand),0 1px 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.nav .count{font:600 14px var(--cond);color:var(--ink2)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:8px;padding:0 8px}
.btn{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);border-color:transparent}.btn.primary:hover{color:var(--on-brand);filter:brightness(1.08)}
.btn[disabled]{opacity:.7;cursor:progress}
main{padding:36px 44px 96px;max-width:1240px;min-width:0}
main:focus{outline:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.lede{color:var(--ink2);max-width:72ch;margin:6px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.filters button{cursor:pointer;border:1px solid var(--rule);background:transparent;border-radius:99px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.filters button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip{display:inline-block;background:var(--chip);color:var(--ink2);border-radius:5px;padding:0 6px;font-size:12px;line-height:20px;white-space:nowrap;margin-right:4px}
.note{font-size:12.5px;color:var(--ink2)}

/* the signature: a highlighter stroke, used only for best bets and best prices */
.hl{background-image:linear-gradient(100deg,transparent 0 1%,var(--mark) 2% 97%,transparent 99%);background-size:100% 92%;background-position:0 55%;background-repeat:no-repeat;color:var(--mark-ink);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-cell{background:var(--mark);color:var(--mark-ink) !important;font-weight:700}
.hl-cell a{color:var(--mark-ink)}
@media (prefers-reduced-motion:no-preference){
  .draw .hl{animation:draw .8s cubic-bezier(.2,.7,.2,1) both}
  .draw .slip-row:nth-child(3) .hl{animation-delay:.14s}.draw .slip-row:nth-child(4) .hl{animation-delay:.28s}
  @keyframes draw{from{background-size:0% 92%;color:var(--ink)}60%{color:var(--ink)}to{background-size:100% 92%;color:var(--mark-ink)}}
}

.today{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.side{position:sticky;top:18px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 5%,transparent)}
.brief{border-left:3px solid var(--brand);padding:2px 0 2px 14px;margin:0 0 18px;max-width:75ch}

.slip{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px color-mix(in srgb,var(--brand) 7%,transparent)}
.slip-main{min-height:74px}
.slip-head,.slip-main{display:grid;grid-template-columns:40px minmax(0,1fr) 96px 72px 92px 60px;gap:12px}
.slip-head{padding:9px 20px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.slip-row{border-bottom:1px solid var(--rule)}
.slip-row:last-child{border-bottom:0}
.slip-main{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 96px 72px 92px 60px;gap:14px;padding:16px 20px;align-items:center}
.slip-main:hover{background:var(--sheet2)}
.slip-main:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.rank{font:700 28px/1 var(--cond);color:var(--ink2)}
.slip-row.best .rank{color:var(--brand)}
.pick{font:700 21px/1.15 var(--cond);letter-spacing:.005em}
.sub{font-size:12.5px;color:var(--ink2);margin-top:5px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;white-space:pre-wrap}
.price{font:700 21px/1 var(--cond)}
.price small{display:block;font:500 12px var(--text);color:var(--ink2);margin-top:4px}
.ev{font:700 20px/1 var(--cond)}
.meter{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px}
.stake{font:600 18px var(--cond)}
.tier{font:600 12.5px var(--text);padding:0 7px;border-radius:5px;line-height:20px}
.tier.best{background:var(--mark);color:var(--mark-ink)}
.tier.solid{background:var(--chip);color:var(--win)}
.tier.lean{background:var(--chip);color:var(--ink2)}
.slip-detail{display:none;padding:2px 18px 20px 70px}
.slip-row[data-open="true"] .slip-detail{display:block}
.slip-row[data-open="true"] .slip-main{background:var(--sheet2)}
.thebet{border:2px solid var(--brand);border-radius:10px;padding:12px 14px;margin:6px 0 14px;max-width:78ch}
.slip-row.best .thebet{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 14%,var(--sheet))}
.thebet b{font-family:var(--cond);font-size:18px;margin-right:4px}
.why{max-width:78ch;margin:0 0 14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px 28px}
.cols h4{margin:0 0 6px;font:600 17px var(--cond)}
.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv td{padding:4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.kv td:first-child{color:var(--ink2);padding-right:10px}
.kv td.num{text-align:right;white-space:nowrap;padding:4px 6px}
.list{list-style:none;margin:0;padding:0}.list li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}.list li:last-child{border:0}
.post{background:var(--sheet2);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}

.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
.grid th{background:transparent;text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.grid td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid .c{text-align:center;white-space:nowrap}
.gamehead td{background:var(--sheet2);font-weight:600;padding-top:12px;padding-bottom:8px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);margin-top:12px}
.lane{padding:12px 14px 4px 0;border-right:1px solid var(--rule);min-width:0}
.lane+.lane{padding-left:14px}
.lane:last-child{border-right:0}
.lane h4{margin:0 0 6px;font:600 17px var(--cond)}
.thread{margin-bottom:18px}
.thread-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.heat{display:flex;gap:3px}.heat i{width:10px;height:10px;border-radius:2px;background:var(--chip)}.heat i.on{background:var(--brand)}
.flag{color:var(--loss);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.tile .v{font:700 23px var(--cond)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.seg button{cursor:pointer;border:0;background:transparent;padding:5px 12px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--ink2);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
.az{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12px;color:var(--ink2);font-weight:500}
.field select,.field input{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.field select:focus,.field input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.leg{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--sheet2)}
.leg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.leg-top b{font:700 17px var(--cond)}
.leg-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px}
.leg-grid .w1{grid-column:span 1}.leg-grid .w2{grid-column:span 2}.leg-grid .w3{grid-column:span 3}.leg-grid .w4{grid-column:span 4}.leg-grid .w6{grid-column:span 6}
.x{all:unset;cursor:pointer;color:var(--ink2);padding:0 6px;border-radius:6px;font-size:18px;line-height:22px}.x:hover{color:var(--loss);background:var(--chip)}
.x:focus-visible{outline:2px solid var(--link)}
.az-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dial{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dial svg{flex:none}
.dial .big{font:700 46px/1 var(--cond)}
.grade{display:inline-block;font:700 15px var(--cond);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 9px;margin-top:6px}
.g-Strong,.g-Good{background:color-mix(in srgb,var(--win) 16%,var(--sheet));color:var(--win)}
.g-Fair{background:var(--chip);color:var(--ink2)}
.g-Weak,.g-Poor{background:color-mix(in srgb,var(--loss) 14%,var(--sheet));color:var(--loss)}
.az-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:14px 0}
.az-tiles .tile{padding:8px 10px}.az-tiles .v{font-size:21px}
.err{color:var(--loss);font-weight:600}
@media (max-width:1180px){.az{grid-template-columns:1fr}}
@media (max-width:560px){.leg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.leg-grid .w3,.leg-grid .w4,.leg-grid .w6{grid-column:span 2}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1180px){.today{grid-template-columns:1fr}.side{position:static}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--rule);gap:10px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1}
  .nav button{white-space:nowrap;padding:6px 10px}.nav .count{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--brand)}
  .rail-foot{display:none}
  main{padding:18px 16px 60px}
  h1{font-size:32px}
  .slip-head{display:none}
  .slip-main{grid-template-columns:30px minmax(0,1fr) auto;row-gap:6px;padding:14px 14px}
  .slip-main .c-ev,.slip-main .c-conf,.slip-main .c-stake{grid-column:2}
  .slip-main .c-ev::before{content:"Edge ";font:500 12.5px var(--text);color:var(--ink2)}
  .slip-main .c-stake::before{content:"Stake ";font:500 12.5px var(--text);color:var(--ink2)}
  .slip-main .c-conf::before{content:"Confidence ";font:500 12.5px var(--text);color:var(--ink2)}
  .slip-main .c-conf .meter{max-width:160px}
  .slip-detail{padding:0 14px 16px}
  .lanes{grid-template-columns:1fr}.lane{border-right:0;padding-left:0 !important;border-bottom:1px solid var(--rule)}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo">Edge<b>Desk</b></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <span id="stamp">Loading…</span>
      <button class="btn" id="refresh" type="button">Refresh data</button>
      <button class="btn" id="theme" type="button">Switch theme</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"><div class="empty"><span class="spin"></span> Loading today's board…</div></main>
</div>
<script>
const VIEWS=[["today","Today"],["analyzer","Bet analyzer"],["parlays","Parlays"],["props","Props & alt lines"],["games","Games"],
 ["money","Money trail"],["markets","Markets"],["news","News"],["sources","Sources"]];
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D=null, view=store.get("ed-view","today"), league="All", open=new Set(), lineMkt="ml", newsTab="world", drew=false,
    propTab="props", gameTab="lines", moneyTab="all";
if(!VIEWS.some(v=>v[0]===view))view="today";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(x,d=1)=>x==null?"–":(x*100).toFixed(d)+"%";
const sgn=(x,d=1)=>x==null||isNaN(x)?"–":(x>0?"+":"")+Number(x).toFixed(d);
const ago=iso=>{if(!iso)return"";const m=(Date.now()-new Date(iso))/6e4;return m<1?"just now":m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const when=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?"":d.toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})};
function spark(v,w=110,h=26){if(!v||v.length<2)return"";const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(y-mn)/r*(h-4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--${v[v.length-1]>=v[0]?"win":"loss"})" stroke-width="1.6" points="${pts}"/></svg>`}
const MKT={moneyline:"Moneyline",spread:"Spread",total:"Total",alt_spread:"Alt spread",alt_total:"Alt total",prop:"Player prop",alt_prop:"Alt player line"};
const seg=(key,cur,opts)=>`<div class="seg" role="group">${opts.map(([k,l])=>`<button type="button" data-seg="${key}:${k}" aria-pressed="${k===cur}">${l}</button>`).join("")}</div>`;

function tier(c,i){const conf=c.ai_confidence??c.confidence;
  if((i<3&&c.ev>=.03&&conf>=50)||(c.ai_verdict==="bet"&&i<3))return["best","Best bet"];
  return c.ev>=.03&&conf>=45?["solid","Solid"]:["lean","Lean"]}

function counts(){if(!D)return{};return{today:(D.bets||[]).length,parlays:(D.parlays||[]).length,props:(D.props_board||[]).length+(D.alt_board||[]).length,
  games:(D.games||[]).filter(g=>g.n_books>1||g.model).length,money:(D.money_trail||[]).length}}
function go(v){view=v;store.set("ed-view",view);league="All";nav();render();$("#main").focus({preventScroll:true});window.scrollTo(0,0)}
function nav(){const c=counts();$("#nav").innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" ${k===view?'aria-current="page"':""}><span>${l}</span>${c[k]!=null?`<span class="count num">${c[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
async function load(){
  const r=await fetch("/api/dashboard").then(r=>r.json()).catch(()=>null);
  if(r){$("#refresh").disabled=r.running;$("#refresh").innerHTML=r.running?`<span class="spin"></span> Updating…`:"Refresh data";
    $("#refresh").title=r.running?(r.progress||""):"";
    if(r.dashboard&&(!D||D.generated!==r.dashboard.generated)){D=r.dashboard;nav();render()}
    if(!r.dashboard)$("#main").innerHTML=`<div class="empty"><span class="spin"></span> ${esc(r.progress||"Building today's board — about two minutes on first run.")}</div>`;
    if(D)$("#stamp").textContent="Updated "+ago(D.generated)+(D.counts?` from ${D.counts.books} books`:"");}
  setTimeout(load,r&&(r.running||!D)?3000:30000)}
$("#refresh").onclick=async()=>{await fetch("/api/refresh",{method:"POST"});setTimeout(load,400)};
$("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store.set("ed-theme",nx)};
(()=>{const t=store.get("ed-theme",null);if(t)document.documentElement.dataset.theme=t})();

function render(){if(!D)return;const f={today,analyzer,parlays,props,games,money,markets,news,sources}[view]||today;
  $("#main").innerHTML=f();wire()}
function wire(){
  document.querySelectorAll(".slip-main").forEach(b=>b.onclick=()=>{const row=b.closest(".slip-row"),id=row.dataset.id;
    const o=row.dataset.open!=="true";row.dataset.open=o;b.setAttribute("aria-expanded",o);o?open.add(id):open.delete(id)});
  document.querySelectorAll("[data-league]").forEach(b=>b.onclick=()=>{league=b.dataset.league;render()});
  document.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>{lineMkt=b.dataset.lm;render()});
  document.querySelectorAll("[data-news]").forEach(b=>b.onclick=()=>{newsTab=b.dataset.news;render()});

    if(lineMkt==="spread"){const l=x["spread_"+side],o=x[`spread_${side}_odds`];return l!=null&&o?{t:(l>0?"+":"")+l+" "+fm(o),v:l*10+dec(o)}:null}

  ${tr.slice(0,60).map(x=>`<tr><td class="num">${esc(x.traded)}</td><td>${esc(x.member)} <span class="note">${esc(x.party)}</span></td><td><b>${esc(x.ticker)}</b> <span class="note">${esc((x.asset||"").slice(0,36))}</span></td><td class="${/purchase/i.test(x.type)?"good":/sale/i.test(x.type)?"bad":""}">${esc(x.type)}</td><td class="num">${esc(x.amount)}</td></tr>`).join("")}</tbody></table></div>`}
function news(){const n=D.news||{};const tabs=[["world","World"],["us","U.S."],["mojo","Mother Jones"],["business","Business"],["tech","TLDR & tech"],["hn","Hacker News"],["sports","Sports"],["social","Social"]];
  const items=newsTab==="social"?(D.social_pulse||[]).map(p=>({title:p.title||p.text,link:p.url,source:p.source,published:p.at})):newsTab==="mojo"?(n.us||[]).filter(i=>i.source==="Mother Jones"):(n[newsTab]||[]);
  return header("News","World, U.S. and business headlines, Mother Jones, TLDR's tech and AI stories, Hacker News, sports, and Reddit's hottest threads.")+
  `<div class="seg" role="group" aria-label="News section">${tabs.map(([k,l])=>`<button type="button" data-news="${k}" aria-pressed="${k===newsTab}">${l}</button>`).join("")}</div>
  <div class="panel"><ul class="list">${items.slice(0,40).map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>${i.summary&&newsTab==="tech"?`<div class="note">${esc(i.summary)}</div>`:""}<div class="note">${esc(i.source)}${i.points?`, ${i.points} points`:""}${i.published?", "+ago(i.published):""}</div></li>`).join("")||'<li class="muted">Nothing loaded for this section on the last refresh.</li>'}</ul></div>`}
function stocks(){const q=D.tape||[];const tile=x=>`<div class="tile"><div class="note">${esc(x.label)} (${esc(x.symbol)})</div><div class="v num">${x.price!=null?x.price.toLocaleString(undefined,{maximumFractionDigits:2}):"–"}</div><div class="note num"><span class="${x.chg1d>=0?"good":"bad"}">${sgn(x.chg1d,2)}% today</span>${x.chg1m!=null?`, <span class="${x.chg1m>=0?"good":"bad"}">${sgn(x.chg1m,1)}% this month</span>`:""}</div>${spark(x.spark,150,28)}</div>`;
  return header("Stocks","Indices, rates, commodities and the sector ETFs that Connections ties to the news and to Congress trades.")+
  `<h2 style="margin:0 0 10px">Indices & macro</h2><div class="tiles">${q.filter(x=>x.group==="index").map(tile).join("")}</div><h2 style="margin:24px 0 10px">Sectors</h2><div class="tiles">${q.filter(x=>x.group==="sector").map(tile).join("")}</div>`}
function sources(){const s=D.status||{},c=D.counts||{};
  return header("Sources",`${Object.values(s).filter(v=>v.ok).length} of ${Object.keys(s).length} feeds healthy on the last run, which took ${Math.round(D.took_s)} seconds. It priced ${c.books||0} sportsbooks, ${(c.props||0).toLocaleString()} player props and ${(c.alts||0).toLocaleString()} alternate lines. If a feed fails, it's skipped and everything else keeps working.`)+
  `<div class="tablewrap"><table class="grid"><thead><tr><th>Feed</th><th class="c">Records</th><th>Updated</th><th>Note</th></tr></thead><tbody>${Object.entries(s).sort().map(([k,v])=>`<tr><td><span class="${v.ok?"good":"bad"}" aria-hidden="true">●</span> ${esc(k)}<span class="sr">${v.ok?" healthy":" failed"}</span></td><td class="c num">${v.count}</td><td class="note">${ago(v.at)}</td><td class="note">${esc(v.error)}</td></tr>`).join("")}</tbody></table></div>`}

nav();load();
</script>
</body>
</html>
