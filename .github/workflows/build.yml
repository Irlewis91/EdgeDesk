# Builds the downloadable desktop apps and attaches them to a release.
# Runs when a release is published, or by hand for an existing release tag.
name: Build desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the apps to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: EdgeDesk-macOS.zip
          - os: windows-latest
            asset: EdgeDesk-Windows.zip
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packaging tool
        run: python -m pip install pyinstaller pillow
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name EdgeDesk --icon EdgeDesk.icns --add-data "static:static" --osx-bundle-identifier com.edgedesk.app desktop.py
          codesign --force --deep -s - dist/EdgeDesk.app
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --windowed --name EdgeDesk --icon static/icon-512.png --add-data "static:static" desktop.py
      - name: Check the built app starts and serves the page
        shell: bash
        env:
          PORT: "8799"
          EDGEDESK_NO_REFRESH: "1"
          EDGEDESK_NO_BROWSER: "1"
        run: |
          export EDGEDESK_HOME="$RUNNER_TEMP/edgedesk-home"
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/EdgeDesk.app/Contents/MacOS/EdgeDesk; else BIN=dist/EdgeDesk/EdgeDesk.exe; fi
          "$BIN" &
          ok=""
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8799/api/history >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "app did not start"; cat "$EDGEDESK_HOME/logs/edgedesk.log" || true; exit 1; fi
          curl -fs http://127.0.0.1:8799/ | grep -q "Bet analyzer"
          curl -fs http://127.0.0.1:8799/manifest.webmanifest >/dev/null
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM EdgeDesk.exe; else kill %1; fi
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/EdgeDesk.app "${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/EdgeDesk -DestinationPath "${{ matrix.asset }}"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"
